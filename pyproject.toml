[project]
name = "credit-risk-dashboard"
version = "2.0.0"
description = "Explainable, cost-sensitive credit risk scoring with an interactive Streamlit dashboard (UCI German Credit data)."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Tobias Weiß" }]
dependencies = [
    "streamlit>=1.52,<2",
    "pandas>=2.3,<4",
    "numpy>=2.3,<3",
    "matplotlib>=3.10,<4",
    "plotly>=6.5,<8",
    "scikit-learn>=1.7,<2",
    "xgboost>=3.1,<4",
    "shap>=0.50,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6", "tabulate>=0.9"]
notebooks = ["seaborn>=0.13", "ucimlrepo>=0.0.7", "jupyter>=1.1"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::DeprecationWarning", "ignore::FutureWarning", "ignore::UserWarning"]
